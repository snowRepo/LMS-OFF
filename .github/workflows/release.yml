name: Build and Release Installers

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            script: ./build_mac_all.sh
          - os: windows-latest
            script: .\build_windows.bat
          - os: ubuntu-latest
            script: ./build_linux.sh
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make scripts executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x build_mac.sh build_linux.sh build_mac_all.sh

      - name: Install DEB packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends fakeroot binutils

      - name: Generate Windows ICO
        if: runner.os == 'Windows'
        run: magick src\main\resources\icons\icon.png -define icon:auto-resize="256,128,64,48,32,16" src\main\resources\icons\icon.ico

      - name: Build Installer
        run: ${{ matrix.script }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: target/installer/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
